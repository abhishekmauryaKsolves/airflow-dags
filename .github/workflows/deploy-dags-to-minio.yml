name: Deploy DAGs to MinIO

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: true
        type: string

jobs:

  # ==========================================================
  # 1. VALIDATE DAGs
  # ==========================================================
   validate:
     runs-on: [self-hosted, Linux, X64, airflow-minio]

     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          /home/abhishekksi299/airflow_local/venv/bin/python \
            -m compileall -q dags/

      - name: Validate DAG imports
        run: |
          for dag_file in dags/*.py; do
            echo "Validating: $dag_file"
            /home/abhishekksi299/airflow_local/venv/bin/python "$dag_file"
          done

      - name: Validation successful
        run: |
          echo "All DAG validation checks passed."

  # ==========================================================
  # 2. DEPLOY TO STAGING
  # ==========================================================
  deploy-staging:
    needs: validate

    runs-on: [self-hosted, Linux, X64, airflow-minio]

    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployment information
        run: |
          echo "Environment: staging"
          echo "Reason: ${{ inputs.reason || 'Automatic deployment from main' }}"

      - name: Configure MinIO
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mc alias set github-minio \
            http://127.0.0.1:9000 \
            "$MINIO_ACCESS_KEY" \
            "$MINIO_SECRET_KEY"

      - name: Upload DAGs to Staging
        run: |
          mc cp --recursive dags/ \
            github-minio/airflow-dags-staging/dags/

      - name: Verify Staging upload
        run: |
          mc ls github-minio/airflow-dags-staging/dags/


  # ==========================================================
  # 3. DEPLOY TO PRODUCTION
  # ==========================================================
  deploy-production:
    needs: deploy-staging

    runs-on: [self-hosted, Linux, X64, airflow-minio]

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployment information
        run: |
          echo "Environment: production"
          echo "Reason: ${{ inputs.reason || 'Promotion from staging' }}"

      - name: Configure MinIO
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mc alias set github-minio \
            http://127.0.0.1:9000 \
            "$MINIO_ACCESS_KEY" \
            "$MINIO_SECRET_KEY"

      - name: Upload DAGs to Production
        run: |
          mc cp --recursive dags/ \
            github-minio/airflow-dags/dags/

      - name: Verify Production upload
        run: |
          mc ls github-minio/airflow-dags/dags/
